name: Deploy leaderboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "main_v5.tex"
      - "scripts/build_leaderboard.py"
      - "fig/taxonomy.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build leaderboard page
        run: python scripts/build_leaderboard.py --tex main_v5.tex --out _site/index.html

      - name: Copy figures
        run: |
          mkdir -p _site/fig
          cp fig/taxonomy.png _site/fig/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
